# Drum Studio: a static site with no build step on Netlify. The Dart is
# compiled locally (sh dart/build.sh) and the output in js/ is committed.
[build]
  publish = "."

# Security headers for every file. The policy allows nothing from other
# sites and no inline scripts or styles.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cross-Origin-Opener-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; media-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests"

# Device features. The microphone is allowed only on the tuning page, and
# only for this site. (Set per page, not in "/*", so the two values never
# get merged into one header.)
[[headers]]
  for = "/"
  [headers.values]
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
[[headers]]
  for = "/index.html"
  [headers.values]
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
[[headers]]
  for = "/tuning"
  [headers.values]
    Permissions-Policy = "camera=(), microphone=(self), geolocation=(), payment=(), usb=()"
[[headers]]
  for = "/tuning.html"
  [headers.values]
    Permissions-Policy = "camera=(), microphone=(self), geolocation=(), payment=(), usb=()"

# The service worker must always be fresh so updates reach installed apps.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
